<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="mr.game">
    <title>Mr.game1</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
            'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
            'Open Sans', 'Helvetica Neue', sans-serif;
            box-sizing: border-box;
        }

        header{
            border-bottom: 2px solid white;
            min-height: 70px;
            width: 100%;
            z-index: 100;
            position: fixed;
            top: 0;
            left: 0;
            align-items: center;
            display: flex;
            justify-content: space-between;
        }

        header ul{
            align-items: center;
            margin: 20px 30px;
            display: flex;
            list-style: none;
        }

        li{
            margin: 15px;
        }

        a{
            padding: 5px 10px;
            transition: 0.3s;
            color: white;
            text-decoration: none;
        }

        body{
            min-height: 100vh;
            background: linear-gradient(#383ef9,#8db0ed);
            overflow-x: hidden;
        }

        header h2{
            margin: 30px;
            color: white;
        }

        a:hover{
            transform: scale(1.25);
            color: black;
            background-color: aliceblue;
            border-radius: 20px;
            padding: 5px 10px;
        }

        @media (max-width: 700px){
            header{
                flex-direction: column;
                padding: 10px 0;
            }

            header h2{
                margin: 5px 0 8px;
            }

            header ul{
                margin: 0;
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            li{
                margin: 5px 7px;
            }

            a{
                font-size: 14px;
                padding: 5px 8px;
            }
        }

        @media (max-width: 400px){
            li{
                margin: 4px 3px;
            }

            a{
                font-size: 13px;
                padding: 5px 6px;
            }
        }
    </style>
</head>

<body id="A1">

    <header class="head">
        <h2>mr.game</h2>

        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="ps1.html">ps1</a></li>
            <li><a href="ps2.html">ps2</a></li>
            <li><a href="win.html">win</a></li>
            <li><a href="ps4.html">ps4</a></li>
            <li><a href="psp.html">psp</a></li>
        </ul>
    </header>

</body>
</html>
