<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello you</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            box-sizing: border-box;
        }

        header{
            height: 70px;
            width: 100%;
            z-index: 100;
            align-items: center;
            display: flex;
            justify-content: space-between;
        }

        header ul{
            align-items: center;
            margin: 50px;
            display: flex;
            list-style: none;
        }

        li{
            margin: 30px;
        }

        a{
            padding: 5px 10px;
            transition: 0.67s;
            color: white;
            text-decoration: none;
        }

        body{
            min-height: 100vh;
            background: linear-gradient(#383ef9,#8db0ed);
            overflow-x: hidden;
        }

        header h2{
            margin: 30px;
            color: white;
        }

        a:hover{
            transform: scale(1.25);
            color: black;
            background-color: aliceblue;
            border-radius: 20px;
            padding: 5px 10px;
        }

        #A1{
            background-color: white;
            width: 300px;
            min-height: 300px;
            position: absolute;
            top: 160px;
            left: 70px;
            border-radius: 20px;
            padding: 20px;
        }

        #A2{
            text-align: center;
        }

        #i1{
            width: 170px;
            height: 170px;
            border-radius: 10px;
            object-fit: cover;
        }

        #btn{
            border: none;
            border-radius: 7px;
            background-color: rgb(168, 168, 255);
            padding: 8px 12px;
            cursor: pointer;
        }

        #btn a{
            color: black;
        }

        @media (max-width: 700px){

            header{
                height: auto;
                padding: 10px 0;
                flex-direction: column;
            }

            header h2{
                margin: 5px 0 10px;
            }

            header ul{
                margin: 0;
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            li{
                margin: 5px 7px;
            }

            a{
                font-size: 14px;
                padding: 5px 7px;
            }

            #A1{
                width: calc(100% - 30px);
                max-width: 300px;
                height: auto;
                min-height: 300px;
                top: 170px;
                left: 50%;
                transform: translateX(-50%);
            }

            #i1{
                width: 170px;
                height: 170px;
            }
        }

        @media (max-width: 400px){

            li{
                margin: 4px 3px;
            }

            a{
                font-size: 13px;
                padding: 5px 6px;
            }

            #A1{
                top: 175px;
            }

            #i1{
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>

            <br><br>

            <br><br>

            <button id="btn">
