<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello you</title>

    <style>
*{
    padding: 0px;
    margin: 0px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}

header{
    border-bottom: 2px white;
    height: 70px;
    width: 100%;
    z-index: 100;
    position: fixed;
    align-items: center;
    display: flex;
    justify-content: space-between;
}

header ul{
    align-items: center;
    margin: 50px;
    display: flex;
    list-style: none;
}

li{
    margin: 30px;
}

a{
    padding: 5px 10px;
    transition: 0.67s;
    color: white;
    text-decoration: none;
}

body{
    min-height: 100vh;
    background: linear-gradient(#383ef9,#8db0ed);
    overflow-x: hidden;
}

header h2{
    margin: 30px;
    color: white;
}

hr{
    position: absolute;
}

a:hover{
    transform: scale(1.25);
    color: black;
    background-color: aliceblue;
    border-radius: 20px;
    padding: 5px 10px;
}

@media (max-width: 700px){

    header{
        height: auto;
        min-height: 70px;
        padding: 10px 0;
        flex-direction: column;
    }

    header h2{
        margin: 5px 0 10px;
    }

    header ul{
        margin: 0;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
    }

    li{
        margin: 5px 7px;
    }

    a{
        font-size: 14px;
        padding: 5px 8px;
    }
}

@media (max-width: 400px){

    li{
        margin: 4px 3px;
    }

    a{
        font-size: 13px;
        padding: 5px 6px;
    }
}
    </style>
</head>
