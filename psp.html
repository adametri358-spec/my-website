    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}

header{
    border-bottom: 2px white;
    height: 70px;
    width: 100%;
    z-index: 100;
    position: fixed;
    align-items: center;
    display: flex;
    justify-content: space-between;
}

header ul{
    align-items: center;
    margin: 50px;
    display: flex;
    list-style: none;
}

li{
    margin: 30px;
}

a{
    padding: 5px 10px;
    transition: 0.67s;
    color: white;
    text-decoration: none;
}

body{
    min-height: 100vh;
    background: linear-gradient(#383ef9,#8db0ed);
    overflow-x: hidden;
}

header h2{
    margin: 30px;
    color: white;
}

hr{
    position: absolute;
}

a:hover{
    transform: scale(1.25);
    color: black;
    background-color: aliceblue;
    border-radius: 20px;
    padding: 5px 10px;
}

#A2{
    background-color: white;
    width: 300px;
    height: 300px;
    position: absolute;
    top: 160px;
    left: 70px;
    border-radius: 20px;
    text-align: center;
}

#i1{
    position: absolute;
    top: 30px;
    left: 65px;
    width: 170px;
    height: 170px;
    border-radius: 10px;
}

#A2 span{
    position: absolute;
    top: 215px;
    left: 0;
    width: 100%;
}

#A2 button{
    position: absolute;
    top: 255px;
    left: 50%;
    transform: translateX(-50%);
    border: none;
    padding: 6px 10px;
}

#A2 button a{
    color: black;
}

@media (max-width: 700px){

    header{
        height: auto;
        min-height: 70px;
        padding: 10px 0;
        flex-direction: column;
    }

    header h2{
        margin: 5px 0 10px;
    }

    header ul{
        margin: 0;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
    }

    li{
        margin: 5px 7px;
    }

    a{
        font-size: 14px;
        padding: 5px 8px;
    }

    #A2{
        width: 300px;
        height: 300px;
        top: 180px;
        left: 50%;
        transform: translateX(-50%);
    }
}

@media (max-width: 400px){

    li{

        padding: 5px 6px;
    }

    #A2{
        width: 290px;
