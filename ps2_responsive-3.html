    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    background:linear-gradient(#383ef9,#8db0ed);
    overflow-x:hidden;
}

header{
    width:100%;
    min-height:70px;
    position:fixed;
    top:0;
    left:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    border-bottom:2px solid rgba(255,255,255,.7);
    background:rgba(56,62,249,.15);
    backdrop-filter:blur(8px);
}

header h2{
    color:white;
    white-space:nowrap;
}

header ul{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    list-style:none;
}

header li{
    margin:0;
}

header a{
    display:block;
    padding:8px 12px;
    color:white;
    text-decoration:none;
    border-radius:20px;
    transition:.3s;
    white-space:nowrap;
}

header a:hover{
    transform:scale(1.08);
    color:black;
    background-color:aliceblue;
}

/* Game cards */
.games-container{
    width:100%;
    padding:120px 30px 40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,300px));
    justify-content:start;
    gap:30px;
}

.game-card{
    width:100%;
    min-height:300px;
    padding:20px;
    background:white;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.game-card img{
    display:block;
    width:170px;
    height:170px;
    max-width:100%;
    margin:0 auto 18px;
    object-fit:cover;
    border-radius:10px;
}

.game-title{
    display:block;
    margin-bottom:18px;
    color:#555;
    font-size:16px;
    overflow-wrap:anywhere;
}

.download-btn{
    display:inline-block;
    padding:7px 12px;
    border:0;
    border-radius:7px;
    background-color:rgb(168,168,255);
    color:#111;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
}

.download-btn:hover{
    transform:scale(1.05);
}

/* Tablet */
@media(max-width:900px){
    header{
        padding:0 18px;
    }

    header h2{
        font-size:20px;
    }

    header ul{
        gap:2px;
    }

    header a{
        padding:7px 8px;
        font-size:14px;
    }

    .games-container{
        padding-left:20px;
        padding-right:20px;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    }
}

/* Phone */
@media(max-width:650px){
    header{
        min-height:auto;
        padding:12px;
        flex-direction:column;
        gap:8px;
    }

    header h2{
        font-size:20px;
    }

    header ul{
        width:100%;
        display:grid;
        grid-template-columns:repeat(3,1fr);
        gap:5px;
    }

    header li{
        width:100%;
    }

    header a{
        padding:8px 4px;
        text-align:center;
        font-size:13px;
    }

    header a:hover{
        transform:none;
    }

    .games-container{
        padding:150px 15px 30px;
        grid-template-columns:1fr;
        justify-items:center;
    }

    .game-card{
        width:min(100%,320px);
    }
}

/* Very small phones */
@media(max-width:380px){
    header ul{
        grid-template-columns:repeat(2,1fr);
    }

    .games-container{
        padding-top:195px;
    }
}

</style>
